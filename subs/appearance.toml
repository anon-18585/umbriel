[appearance]
prefer_no_csd = true
border_width = 2
outer_border_width = 1
corner_radius = 0
drag_opacity = 0.75
opaque_fullscreen = true

#                 --- Tab Bar appearance ---
[appearance.tab_bar]
style = "titles"
position = "top"
height = 24
font = "jetbrainsmono nerd bold 9"
padding = 8
tab_gap = 2
corner_radius = -1
title_format = "{title}"
title_align = "center"
visible = true
hide_when_single = false
max_tabs = 0
overflow = "scroll"

#                 --- Blur settings ---
[appearance.blur]
enabled = true
optimized = true
passes = 3
radius = 5
noise = 0.02
brightness = 0.9
contrast = 0.9
saturation = 1.1

#                 --- Shadow settings ---
[appearance.shadow]
enabled = true
softness = 10
offset_x = 2
offset_y = 2
