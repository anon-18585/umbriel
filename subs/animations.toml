[animation]
enabled = true
duration_ms = 150
curve = "easeout"

[animation.windows_in]
enabled = true
curve = "spring:1,900"
style = "popin"
scale = 0.5

[animation.windows_out]
enabled = true
curve = "spring:1,1400"
style = "popin"
scale = 0.8

[animation.windows_move]
enabled = true
curve = "spring:1,1000"

[animation.workspaces]
style = "slide"
enabled = true
curve = "spring:1,800"

[animation.overview]
enabled = true
curve = "spring:1,800"
workspace_curve = "spring:1,1000"

[animation.scratchpad]
enabled = true
curve = "spring:1,800"
dim = 0.50
blur = false

[animation.border]
enabled = true
curve = "spring:1,900"

[animation.dim_unfocused]
enabled = false
dim = 0.0

[animation.layers]
enabled = false

[animation.windows_drag]
# wobble physics at drag 
physics = false
stiffness = 20
damping = 100 
coupling = 100.0
pointer_response = 2.0
# placement 
max_displacement_px = 200.0
settle_after_pause_s = 0.25
